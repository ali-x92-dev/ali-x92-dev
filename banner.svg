<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Building, learning, improving, repeating">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b3a"/>
      <stop offset="1" stop-color="#0b3b2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g fill="#39d353">
    <g opacity="0.25"><rect x="50" y="40" width="18" height="18" rx="4"/><rect x="74" y="40" width="18" height="18" rx="4"/><rect x="50" y="64" width="18" height="18" rx="4"/><rect x="1108" y="218" width="18" height="18" rx="4"/><rect x="1132" y="218" width="18" height="18" rx="4"/><rect x="1132" y="194" width="18" height="18" rx="4"/></g>
    <g opacity="0.7"><rect x="98" y="40" width="18" height="18" rx="4"/><rect x="50" y="88" width="18" height="18" rx="4"/><rect x="1084" y="242" width="18" height="18" rx="4"/><rect x="1132" y="242" width="18" height="18" rx="4"/></g>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="145" font-size="54" font-weight="700" fill="#ffffff">Turning ideas into reality</text>
    <text x="600" y="198" font-size="24" fill="#8b949e" font-family="Consolas, Menlo, monospace">Building. Learning. Improving. Repeating.</text>
  </g>
  <rect x="540" y="225" width="120" height="5" rx="2.5" fill="#39d353">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
